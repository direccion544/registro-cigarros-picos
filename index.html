<!doctype html>
<html lang="es"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111111">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Registro">
<link rel="manifest" href="./manifest.webmanifest">
<title>Registro</title>
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f4f4f4;color:#111}
body{overscroll-behavior:none}main{max-width:560px;margin:auto;padding:22px 16px 40px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}
h1{margin:0;font-size:28px}.date{font-size:14px;color:#666}
button{border:0;border-radius:15px;font-size:18px;font-weight:700;padding:18px;width:100%;margin:6px 0}
.cigar{background:#111;color:#fff}.pico{background:#ddd;color:#111}.secondary{background:#e9e9e9;color:#111;font-size:15px}
.card{background:#fff;border-radius:18px;padding:17px;margin-top:16px;box-shadow:0 2px 12px #0000000b}.count{font-size:38px;font-weight:800}.muted{color:#666}
.entry{padding:12px 0;border-bottom:1px solid #eee}.entry:last-child{border:0}.tag{display:inline-block;border-radius:9px;padding:4px 8px;font-size:11px;font-weight:800;margin-right:7px}.t-cig{background:#111;color:#fff}.t-pico{background:#ddd}
.modal{position:fixed;inset:0;background:#0008;display:none;align-items:center;justify-content:center;padding:16px;z-index:9999;overflow:auto}
.sheet{background:#fff;border-radius:22px;padding:20px;width:min(560px,100%);max-height:90vh;overflow:auto}.sheet h2{margin:0 0 16px}.sheet label{display:block;font-size:13px;font-weight:700;margin:12px 0 5px}
input,textarea{width:100%;border:1px solid #d8d8d8;border-radius:11px;padding:11px;font:inherit;background:#fff}textarea{min-height:80px;resize:vertical}
.save{background:#111;color:#fff}.cancel{background:#eee}.small{font-size:12px;color:#777;margin-top:8px}
</style></head>
<body>
<main>
<div class="top"><h1>Registro</h1><div class="date" id="todayLabel"></div></div>
<button type="button" class="cigar" onclick="openForm('cigarro',true)">CIGARRO — AHORA</button>
<button type="button" class="pico" onclick="openForm('pico',true)">PICO — AHORA</button>
<button type="button" class="secondary" onclick="openForm('cigarro',false)">Registrar CIGARRO anterior</button>
<button type="button" class="secondary" onclick="openForm('pico',false)">Registrar PICO anterior</button>
<button type="button" class="secondary" onclick="exportWeek()">EXPORTAR EXCEL — ÚLTIMOS 7 DÍAS</button>
<button type="button" class="secondary" onclick="exportAll()">EXPORTAR EXCEL — TODO EL HISTORIAL</button>
<div class="card"><div class="muted">Cigarros hoy</div><div class="count" id="count">0</div></div>
<div class="card"><strong>Hoy</strong><div id="today"></div></div>
<div class="card"><strong>Historial</strong><div id="history"></div></div>
</main>
<div class="modal" id="modal"><div class="sheet">
<h2 id="title">Registrar</h2>
<label>Fecha</label><input id="dateInput" type="date">
<label>Hora real del evento</label><input id="timeInput" type="time">
<label id="descLabel">Descripción</label>
<textarea id="descInput"></textarea>
<div class="small">La hora guardada es la del cigarro o pico, no la hora de introducción.</div>
<button type="button" class="save" onclick="saveEntry()">GUARDAR</button>
<button type="button" class="cancel" onclick="closeForm()">CANCELAR</button>
</div></div>
<script>
const KEY="registro_cigarros_picos_v5";
let data=JSON.parse(localStorage.getItem(KEY)||"[]"), currentType="cigarro";
const pad=n=>String(n).padStart(2,"0");
function localDate(){const d=new Date();return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate())}
function localTime(){const d=new Date();return pad(d.getHours())+":"+pad(d.getMinutes())}
function eventDate(date,time){return date+"T"+time+":00"}
function dateKey(s){const d=new Date(s);return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate())}
function fmtDate(k){const [y,m,d]=k.split("-");return d+"/"+m+"/"+y}
function fmtTime(s){return new Date(s).toLocaleTimeString("es-ES",{hour:"2-digit",minute:"2-digit"})}
function esc(s){return String(s||"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]))}
function persist(){localStorage.setItem(KEY,JSON.stringify(data));render()}
function addNow(type){data.push({type,at:new Date().toISOString(),description:""});persist()}
function openForm(type,now){
 currentType=type; document.getElementById("title").textContent=type==="cigarro"?"Registrar cigarro":"Registrar pico";
 document.getElementById("descLabel").textContent=type==="cigarro"?"Descripción / contexto":"Sensación / descripción";
 document.getElementById("descInput").placeholder=type==="cigarro"?"Ej.: trabajando, desplazamiento, después de comer...":"Ej.: nervios, tensión, inquietud...";
 document.getElementById("dateInput").value=localDate(); document.getElementById("timeInput").value=now?localTime():""; document.getElementById("descInput").value="";
 document.getElementById("modal").style.display="flex"; document.body.style.overflow="hidden";
}
function closeForm(){document.getElementById("modal").style.display="none";document.body.style.overflow=""}
function saveEntry(){
 const date=document.getElementById("dateInput").value,time=document.getElementById("timeInput").value;
 if(!date||!time){alert("Indica fecha y hora.");return}
 data.push({type:currentType,at:eventDate(date,time),description:document.getElementById("descInput").value.trim()});
 data.sort((a,b)=>new Date(a.at)-new Date(b.at));persist();closeForm()
}
function render(){
 const today=localDate(); document.getElementById("todayLabel").textContent=fmtDate(today);
 const td=data.filter(x=>dateKey(x.at)===today).sort((a,b)=>new Date(a.at)-new Date(b.at));
 document.getElementById("count").textContent=td.filter(x=>x.type==="cigarro").length;
 document.getElementById("today").innerHTML=td.length?td.map(x=>'<div class="entry"><span class="tag '+(x.type==="cigarro"?"t-cig":"t-pico")+'">'+(x.type==="cigarro"?"CIGARRO":"PICO")+'</span><b>'+fmtTime(x.at)+'</b>'+(x.description?'<br>'+esc(x.description):"")+'</div>').join(""):"<p class='muted'>Sin registros hoy.</p>";
 const groups={};data.forEach(x=>(groups[dateKey(x.at)]??=[]).push(x));
 const keys=Object.keys(groups).sort((a,b)=>b.localeCompare(a));
 document.getElementById("history").innerHTML=keys.map(k=>{const g=groups[k];return '<div class="entry"><b>'+fmtDate(k)+'</b> — '+g.filter(x=>x.type==="cigarro").length+' cigarros, '+g.filter(x=>x.type==="pico").length+' picos</div>'}).join("")||"<p class='muted'>Todavía no hay historial.</p>"
}
function exportXls(entries,name){
 let html='<html><head><meta charset="UTF-8"></head><body><table border="1"><tr><th>Fecha</th><th>Hora</th><th>Tipo</th><th>Descripción</th></tr>';
 entries.sort((a,b)=>new Date(a.at)-new Date(b.at)).forEach(x=>{const d=new Date(x.at);html+='<tr><td>'+pad(d.getDate())+'/'+pad(d.getMonth()+1)+'/'+d.getFullYear()+'</td><td>'+pad(d.getHours())+':'+pad(d.getMinutes())+'</td><td>'+esc(x.type==="cigarro"?"CIGARRO":"PICO")+'</td><td>'+esc(x.description)+'</td></tr>'});
 html+='</table></body></html>'; const blob=new Blob([html],{type:"application/vnd.ms-excel;charset=utf-8"}),a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=name+".xls";a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)
}
function exportWeek(){const cutoff=Date.now()-7*86400000,e=data.filter(x=>new Date(x.at).getTime()>=cutoff);if(!e.length){alert("No hay registros en los últimos 7 días.");return}exportXls(e,"registro_ultimos_7_dias")}
function exportAll(){if(!data.length){alert("No hay registros para exportar.");return}exportXls([...data],"registro_historial_completo")}
render();
</script></body></html>
